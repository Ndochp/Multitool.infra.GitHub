name: Release

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Application repository (owner/repo) to release'
        required: false
        default: ''
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
      artifact_path:
        description: 'Path to artifact file/dir in source (e.g. out/cfg or dist/config.dt)'
        required: false
        default: ''

env:
  SOURCE_PATH: source-code

jobs:
  release:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve target repository
        id: repo
        run: |
          if [ -n "${{ github.event.inputs.repository }}" ]; then
            echo "repository=${{ github.event.inputs.repository }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ vars.APP_REPOSITORY }}" ]; then
            echo "repository=${{ vars.APP_REPOSITORY }}" >> $GITHUB_OUTPUT
          else
            echo "repository=ndochp/multitool" >> $GITHUB_OUTPUT
          fi

      - name: Checkout application repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repo.outputs.repository }}
          ref: ${{ github.event.inputs.tag }}
          token: ${{ secrets.GITHUB_PAT }}
          path: ${{ env.SOURCE_PATH }}

      - name: Build artifacts (1C)
        env:
          ONE_C_PATH: ${{ vars.ONE_C_PATH }}
        run: |
          cd ${{ env.SOURCE_PATH }}
          if [ -f scripts/build.sh ]; then
            chmod +x scripts/build.sh
            ./scripts/build.sh
          else
            echo "No scripts/build.sh; assuming artifacts already in repo or build step skipped."
          fi

      - name: Create Release and upload artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          repository: ${{ steps.repo.outputs.repository }}
          token: ${{ secrets.GITHUB_PAT }}
          generate_release_notes: true
          files: ${{ github.event.inputs.artifact_path != '' && format('{0}/{1}/*', env.SOURCE_PATH, github.event.inputs.artifact_path) || '' }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_PAT }}
