name: Build Pipeline

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'GitHub repository to build (owner/repo). Overrides APP_REPOSITORY variable.'
        required: false
        default: ''

env:
  SOURCE_PATH: source-code

jobs:
  build:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve target repository
        id: repo
        run: |
          if [ -n "${{ github.event.inputs.repository }}" ]; then
            echo "repository=${{ github.event.inputs.repository }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ vars.APP_REPOSITORY }}" ]; then
            echo "repository=${{ vars.APP_REPOSITORY }}" >> $GITHUB_OUTPUT
          else
            echo "repository=ndochp/multitool" >> $GITHUB_OUTPUT
          fi
          echo "Resolved repository: $(cat $GITHUB_OUTPUT | grep repository | cut -d= -f2-)"

      - name: Checkout application repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repo.outputs.repository }}
          token: ${{ secrets.GITHUB_PAT }}
          path: ${{ env.SOURCE_PATH }}

